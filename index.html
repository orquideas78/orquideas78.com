<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orquideas78 | Luxury Car Rental</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 50px 20px 30px;
    }

    h1 {
      color: #ffd900;
      font-size: 42px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #aaa;
      font-size: 18px;
    }

    .cars {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .car {
      background: #111;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .car h2 {
      margin-bottom: 8px;
    }

    .price {
      color: #ffd900;
      font-size: 22px;
      font-weight: bold;
    }

    .reserve {
      display: inline-block;
      margin-top: 15px;
      background: #ffd900;
      color: #000;
      padding: 15px 35px;
      border-radius: 10px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <h1>ORQUIDEAS78</h1>
  <div class="subtitle">Luxury Car Rental</div>
</header>

<section class="cars">

  <div class="car">
    <h2>Lamborghini Revuelto</h2>
    <div class="price">Desde 1.200 € / día</div>
    <div class="reserve">RESERVAR</div>
  </div>

  <div class="car">
    <h2>Ferrari Roma</h2>
    <div class="price">Desde 900 € / día</div>
    <div class="reserve">RESERVAR</div>
  </div>

  <div class="car">
    <h2>Mercedes-AMG GT Black Series</h2>
    <div class="price">Desde 800 € / día</div>
    <div class="reserve">RESERVAR</div>
  </div>

</section>

</body>
</html>
